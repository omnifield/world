# Что должно быть на МАШИНЕ, чтобы мир на ней вообще стоял. Спрашивается у самой машины.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ, КОГДА remote.sh И ТАК ПЕЧАТАЕТ «докер на ресурсе есть».
# Затем, что это его собственные слова о собственной работе. Скрипт, сломанный так, что он
# рапортует успех, не поставив, напечатает ровно то же самое — и никто не заметит. Здесь
# состояние машины читает ЧУЖОЙ инструмент, который про наш скрипт не знает ничего.
#
# ИНСТРУМЕНТ — goss (goss-org/goss, Apache-2.0). Сверка с рынком 2026-08-21: смотрели goss,
# InSpec и bats. Взят goss: один статический бинарь без рантайма (InSpec тянет ruby-омнибус,
# bats — это снова свой скрипт с своими утверждениями), а состояние машины он описывает
# ДАННЫМИ, а не кодом — то есть ровно тем, чем оно и является. Версия пинуется в ci.yml,
# и там же проверяется контрольная сумма.
#
# Спека гоняется НА САМОЙ МАШИНЕ (`goss -g … validate`), а не рядом с ней: «докер отвечает»
# — свойство машины, и спрашивать о нём надо там, где оно живёт.
#
# ЭТА СПЕКА ОБЯЗАНА КРАСНЕТЬ. В работе `mashina` она гоняется ДВАЖДЫ: на машине, куда мир
# поставил докер (зелено), и на машине, где мир ставить его ОТКАЗАЛСЯ (обязана покраснеть).
# Второй прогон — сторож самого сторожа: спека, которая зеленеет на машине без докера, не
# проверяет ничего, и узнать об этом надо от работы, а не через месяц.
#
# Юзер `world` назван здесь по имени, и это не зашитая константа мира: так зовут юзера
# машины-контейнера в CI (`ci.yml`, работа `mashina`). Мир имени юзера не знает — оно
# приезжает в адресе (`--addr world@…`), — а спека проверяет ИМЕННО ТУ машину, которую
# работа подняла, и потому вправе знать, кого на ней заводили.

# ДОКЕР СТОИТ — пакетом, а не «где-то лежит бинарь». Ставит его официальный установщик
# (get.docker.com), пакет у него называется так.
package:
  docker-ce:
    installed: true

# СЛУЖБА АКТИВНА — и включена: машина, на которой докер не переживёт перезагрузку, мир
# держит ровно до первого рестарта. Спрашивается у systemd, а не по наличию процесса.
service:
  docker:
    enabled: true
    running: true

command:
  # ДЕМОН ОТВЕЧАЕТ. «Пакет стоит» и «демон отвечает» — разные вещи, и записывать надо вторую.
  docker info:
    exit-status: 0
    timeout: 30000

  # ЮЗЕР, КОТОРЫМ ХОДИТ МИР, ВПРАВЕ ГОВОРИТЬ С ДЕМОНОМ. Проверяется НОВЫМ входом (`su -`):
  # право даётся группой, а группа применяется при входе, и старая сессия о ней не знает.
  # Это ровно тот случай, на который у remote.sh есть отдельный отказ (`docker-install-silent`).
  su - world -c "docker info":
    exit-status: 0
    timeout: 30000

# ГРУППА ЕСТЬ — её заводит установщик докера.
group:
  docker:
    exists: true

# ЮЗЕР В ГРУППЕ. Читается из системных файлов, а не из вывода нашей же команды.
user:
  world:
    exists: true
    groups:
      - docker

# СОКЕТ НА МЕСТЕ И ЭТО СОКЕТ. Файл с таким именем мог бы остаться от чего угодно.
file:
  /var/run/docker.sock:
    exists: true
    filetype: socket
