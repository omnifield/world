# НАДСТРОЙКА к файлу запуска локации: связка ключей юзера приезжает в место.
#
# Подключается ТОЛЬКО когда в конфиге назван `WORLD_SECRETS` — подъём добавляет этот файл
# вторым `-f` (`deploy/location-config.sh`). Не назван — файл не участвует вовсе, и место
# поднимается ровно как раньше: связка добровольна, место без неё законно.
#
# ПОЧЕМУ ОТДЕЛЬНЫМ ФАЙЛОМ, А НЕ СТРОКОЙ В `location-compose.yaml`. Монтирование в компоузе
# не бывает условным: список томов либо есть, либо нет, и пустое значение в нём — ошибка
# разбора, а не «ничего не монтируем». Надстройка — единственный способ сказать «этого может
# не быть» так, чтобы отсутствие не было отказом.
#
# ОСНОВАНИЕ — КАНОН, А НЕ УДОБСТВО. Состояние старшего скоупа доступно вложенным в него
# (`WORLD2` 3.0): место стоит внутри пространства юзера, значит связка ключей — состояние
# этого пространства — месту доступна. Вниз да, вбок и вверх нет: соседнее место чужого
# состояния не видит, реестр поля место не читает.

services:
  world-location:
    volumes:
      # ТОЛЬКО ЧТЕНИЕ, и это не осторожность, а то же правило: доступность не равна
      # владению (`WORLD2` 3.0, пункт 4). Место связкой ПОЛЬЗУЕТСЯ, но она остаётся юзеру —
      # снёс место, связка цела, потому что она никогда ему и не принадлежала. Для работы
      # этого довольно: изнутри места ключом подписываются и по нему ходят, а заводят и
      # отзывают ключи в пространстве юзера, а не в его локации.
      #
      # Куда: `~/.secrets` — та же раскладка, что у девконтейнера первой редакции
      # (`omnifield-secrets` → `/home/node/.secrets`, `kb:WORLD-49`). Дом здесь `/home/world`.
      - "secrets:/home/world/.secrets:ro"

volumes:
  # EXTERNAL — том берётся ГОТОВЫЙ, и это главное свойство этой надстройки. Не объяви мы его
  # внешним, компоуз на опечатку в имени завёл бы новый пустой том имени проекта: место
  # поднялось бы, связка «была бы на месте» и оказалась бы пустой — то есть отказа не
  # случилось бы там, где он обязателен (`WORLD2` 2.3). С `external` докер говорит прямо:
  # внешнего тома с таким именем нет.
  #
  # Том — состояние ПРОСТРАНСТВА ЮЗЕРА, поэтому имя приходит из конфига: у разных юзеров и
  # у разных брендов одного человека связки разные (`kb:WORLD-49`).
  secrets:
    external: true
    name: "${WORLD_SECRETS:?связка ключей не названа — WORLD_SECRETS пусто}"
