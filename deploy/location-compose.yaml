# Файл запуска ЛОКАЦИИ — второе изделие мира (`kb:WORLD-53`).
#
# Поднимает контейнер, в котором стоит СТОРОЖ — минимальная служба «я здесь». Вход в поле
# делает тот же бинарь отдельной командой (`world join`), и делает его `deploy/location-up.sh`
# сразу после того, как сторож ответил: порядок «сначала сторож, потом вход» назван в
# контракте зоны `core` и держится здесь (иначе дверь получит адрес, по которому ещё никого
# нет, и вход честно откажет `self-unreachable`).
#
# Поднимать этим файлом можно и напрямую:
#
#   docker compose -p world-loc-<имя> --env-file deploy/location.env \
#                  -f deploy/location-compose.yaml up -d
#
# но штатный вход — `deploy/location-up.sh`: он делает то же самое одной командой, ждёт
# сторожа, ВВОДИТ ЛОКАЦИЮ В ПОЛЕ и называет причину с выходом, когда что-то не встало
# (`kb:WORLD-31`). Имя проекта (`-p`) задаёт скрипт, а не этот файл: имя проекта — часть
# вызова, и подставить в него значение конфига файл не может. Без `-p` две локации на одной
# машине попали бы в один проект, и вторая молча заменила бы первую.

services:
  # Имя службы — `world-location`, и оно редкое намеренно, ровно по той же причине, что у
  # двери: компоуз назначает службе сетевой алиас по её имени, и отключить это нельзя.
  # Разница с дверью в том, что здесь это имя НИЧЕГО НЕ ЗНАЧИТ: адрес локации — её имя в
  # поле (алиас ниже), и по имени службы к ней не ходит никто. Две локации на одной машине
  # разделят этот алиас между собой — и это ни на что не влияет, потому что контракт лежит
  # не на нём. Уникальное имя у контейнера есть отдельно (`container_name`).
  world-location:
    build:
      # Контекст — корень репозитория: нужен `core/`. Собранного пульта здесь не нужно
      # вовсе — в локацию едет один бинарь (см. шапку `Dockerfile.location`).
      context: ..
      dockerfile: deploy/Dockerfile.location
      # СЕТЬ У СБОРКИ ЕСТЬ, и это изменилось вместе с ландшафтом места
      # (`tasker:WORLD-102`): образ несёт `git`, `nodejs` с `npm`, `ca-certificates` и
      # `curl`, а они приезжают из репозиториев alpine. Прежний `network: none` снят
      # ровно поэтому — с ним сборка не поедет вовсе, и отказ выглядел бы как поломка
      # сети, а не как запрет, который мы сами и поставили.
      #
      # ПОЛЕ при этом НЕ нужно (`kb:WORLD-54`): нужен обычный выход наружу, а не соседи по
      # общей сети и не дверь. Готовый образ поднимается вовсе без сети — переносится
      # `docker save omnifield/location:dev | docker load`.
    image: omnifield/location:dev
    container_name: "world-loc-${WORLD_NAME:?не сказано имя локации — заполни WORLD_NAME в deploy/location.env}"

    # Локация СТОИТ — как и дверь. `unless-stopped`, а не `always`: вернуться после падения
    # и после старта демона обязана, а снятую руками поднимать против воли человека нельзя.
    # Граница та же и названа там же: `deploy/README.md`, раздел «Дверь СТОИТ».
    #
    # Что политика перезапуска НЕ делает: она не входит в поле заново. Вход — отдельная
    # команда, и её делает подъём. Поле при этом лежит на томе двери и переживает
    # пересоздание локации, так что возвращаться в него после рестарта обычно не нужно;
    # если поле потеряли целиком — подними локацию заново, повторный вход не ошибка.
    restart: unless-stopped

    # ХОСТ-ПУБЛИКАЦИИ ЗДЕСЬ НЕТ И НЕ БУДЕТ. Наружу машины торчит ровно одна дверь
    # (`kb:FUND-5`), и она принадлежит миру; локация доступна снаружи ЧЕРЕЗ неё, по своему
    # маршруту `/{имя}/`. Публикация порта локации завела бы второй вход в поле мимо двери —
    # то есть мимо реестра, маршрутов и всего, ради чего дверь существует.

    # Перечислены явно, с умолчаниями, — чтобы раскладку было видно из файла запуска, а не
    # только из конфига. Контракт переменных — `core/README.md`.
    environment:
      # что слушает СТОРОЖ. Порт внутри контейнера фиксирован: на него смотрят EXPOSE и
      # HEALTHCHECK образа, а наружу локация не публикуется вовсе — крутить нечего.
      WORLD_ADDR: ":8080"
      # имя локации в поле = её маршрут за дверью = её имя в общей сети (алиас ниже).
      WORLD_NAME: "${WORLD_NAME:?не сказано имя локации — заполни WORLD_NAME в deploy/location.env}"
      # что локация даёт, одной строкой.
      WORLD_GIVES: "${WORLD_GIVES:?не сказано, что локация даёт — заполни WORLD_GIVES в deploy/location.env}"
      # адрес двери в общей сети, «имя:порт». Умолчание — контрактное имя двери; оно же
      # умолчание `WORLD_DOOR_ALIAS` в `deploy/compose.yaml` и умолчание `WORLD_DOOR` в
      # бинаре. Разъедутся — локация будет стучаться не туда; за этим следит проба
      # ветвления (`probe-branching.sh`).
      WORLD_DOOR: "${WORLD_DOOR:-door:8080}"
      # WORLD_SELF_ADDR не задаётся намеренно: умолчание выводится из имени и порта
      # (`имя:порт`), а имя локации — это и её имя в сети. Задать его здесь значило бы
      # завести второе место, где живёт один и тот же адрес.
      #
      # ГДЕ ВНУТРИ МЕСТА СТОИТ ЗАСТРОЙКА — «хост:порт», из конфига локации. Умолчания нет
      # и не будет: пусто значит «не заявлено», и маршрут места отвечает присутствием
      # сторожа — пустое место законно (`core/README.md`). Мир не сканирует место и не
      # угадывает: подставь мы сюда «разумный» адрес, маршрут повёл бы в вещь, которой
      # человек не поднимал.
      WORLD_BUILD_ADDR: "${WORLD_BUILD_ADDR:-}"

    # СКЛАД ПОД ЗАСТРОЙКУ. То, что на месте построено, обязано пережить пересоздание
    # контейнера: состояние живёт на томе, вне тома только времянки (`kb:WORLD-28`).
    # Точка монтирования — `WORLD_BUILD_DIR` образа (`/place`); там лежат сама постройка
    # (`build/`) и её паспорт (`build.json`), а клон едет во времянку рядом и въезжает
    # переименованием (`core/README.md`).
    #
    # Том ИМЕНОВАННЫЙ, а не привязка к каталогу хоста: у места своё состояние, а не кусок
    # чужой файловой системы, и на Windows привязка ещё и переписала бы путь. Имя тому даёт
    # компоуз от имени проекта (`world-loc-<имя>_place`) — значит у каждой локации склад
    # свой: состояние принадлежит своему пространству целиком, общего на две локации в мире
    # не бывает (`kb:WORLD-28`).
    volumes:
      - place:/place

    networks:
      gateway:
        # АДРЕС ЛОКАЦИИ в общей сети — её имя в поле. Именно этот адрес уезжает в дверь на
        # входе (`WORLD_SELF_ADDR` выводится как `имя:порт`), и именно по нему дверь потом
        # ходит на маршруте. Разойдись алиас с именем — дверь ответила бы `addr-unreachable`
        # на входе, то есть громко и сразу, а не молча.
        aliases:
          - "${WORLD_NAME:?не сказано имя локации — заполни WORLD_NAME в deploy/location.env}"

networks:
  # Сеть общая на машину и старше любого компоуз-проекта: в ней стоит дверь, к которой
  # локация входит по имени. Потому `external` — компоуз её не создаёт и не сносит вместе
  # с проектом. Создаётся один раз (`deploy/up.sh` и `deploy/location-up.sh` делают это
  # сами, идемпотентно).
  gateway:
    external: true
    name: "${WORLD_NET:-omnifield-gateway}"

volumes:
  # Склад под застройку — состояние МЕСТА. Переживает пересоздание контейнера и снятие
  # локации (`location-down.sh` идёт без `-v`): снести место и потерять построенное — разные
  # события, и второе делается отдельной командой, а не заодно.
  #
  # Реестра поля здесь по-прежнему НЕТ: он один на поле и живёт за дверью
  # (`core/README.md`). Ответь локация на регистрацию своим списком — у поля стало бы два
  # состояния. Том тут ровно под то, что на месте ПОСТРОЕНО.
  place:
