# Файл запуска мира — обычный докер, без девконтейнеров.
#
# Здесь описано ровно четыре вещи: что торчит наружу, в какой сети стоит дверь, где лежит
# состояние поля и с какими переменными бежит процесс. Всё остальное — внутри образа.
#
# Поднимать этим файлом можно и напрямую:
#
#   docker network create omnifield-gateway     # один раз на машину
#   docker compose -f deploy/compose.yaml up -d --build
#
# но штатный вход — `deploy/up.sh`: он делает то же самое одной командой и называет
# причину с выходом, когда что-то не встало (`kb:WORLD-31`).
name: world

services:
  # Имя службы — `world-door`, и оно РЕДКОЕ намеренно. Компоуз назначает службе сетевой
  # алиас по её имени, и отключить это нельзя: контейнер всегда откликается на имя своей
  # службы. Значит имя службы — то, что мы занимаем в общей сети НАВСЕГДА, и занимать им
  # ходовое слово нельзя: два контейнера с одним алиасом докер не запрещает, он раздаёт их
  # по кругу, и половина запросов молча уезжает не туда. Так уже вышло с `world` — это имя
  # в сети держит девбокс разработчика.
  #
  # Поэтому имён у двери два, и роли у них разные:
  #   world-door   имя службы. Неотключаемое, редкое, наше. Резервный вход, если контрактное
  #                имя пришлось сменить;
  #   door         КОНТРАКТНОЕ имя, по которому сосед входит в поле (`door:8080`).
  #                Настраивается `WORLD_DOOR_ALIAS` — ровно чтобы его можно было ОСВОБОДИТЬ,
  #                когда в поле оно уже занято. Умолчание продублировано в `up.sh`, и проба
  #                ветвления следит, чтобы эти два умолчания не разъехались.
  world-door:
    build:
      # Контекст — корень репозитория: нужны `core/` и результат первого шага сборки,
      # который лежит в `deploy/.build/web-dist/`.
      context: ..
      dockerfile: deploy/Dockerfile
      # СЕТИ У СБОРКИ НЕТ ВОВСЕ — и это доказательство, а не аскеза. Пульт собирается
      # ДО этого шага, обычным контейнером в сети `omnifield-gateway` (`deploy/build.sh`),
      # потому что произвольную сеть внутри `docker build` buildkit не поддерживает:
      # с `network: omnifield-gateway` сборка падала на обычной машине, где сборщик
      # заранее не настроен (проверено живым прогоном, `tasker:WORLD-37`).
      # Здесь образ только складывает готовое, и `none` это подтверждает машинно.
      network: none
    image: omnifield/world:dev
    container_name: world-door

    # Дверь — ПОСТОЯННАЯ СЛУЖБА, а не разовый запуск. `unless-stopped`, а не `always`:
    # вернуться после падения и после старта демона — обязана, а вот снятую руками дверь
    # поднимать против воли человека нельзя (`docker compose down` — это решение, а не сбой).
    #
    # Граница названа честно: политика докера возвращает контейнер, когда стартует ДЕМОН.
    # Стартует ли сам демон после перезагрузки машины — вопрос к машине, а не к этому файлу
    # (на Windows это галка автозапуска Docker Desktop и вход пользователя). Подробности и
    # то, чего для «всегда» не хватает, — в `deploy/README.md`.
    restart: unless-stopped

    # Единственная хост-публикация во всей системе — дверь (`kb:FUND-5`). Порт задаётся
    # значением, а не зашит: `WORLD_PORT=8090 ./deploy/up.sh`. Слева хост, справа
    # контейнер — контейнерный порт фиксирован, на него смотрят EXPOSE и HEALTHCHECK.
    ports:
      - "${WORLD_PORT:-8080}:8080"

    # Перечислены явно, с умолчаниями, — чтобы раскладку было видно из файла запуска,
    # а не только из образа. Контракт переменных — `core/README.md`.
    environment:
      WORLD_ADDR: ":8080"
      WORLD_WEB_DIR: "/app/web"
      WORLD_DOOR_FILE: "/field/locations.json"
      WORLD_STAND_DIR: "/stand"

    volumes:
      - field:/field
      - stand:/stand

    networks:
      omnifield-gateway:
        # Контрактный адрес двери в общей сети: `door:8080`. Это то, что сосед пишет у себя,
        # и потому оно ОБЪЯВЛЕНО здесь, а не выведено из имени службы случайно.
        #
        # Порт внутри контейнера фиксирован (`WORLD_ADDR`, EXPOSE, HEALTHCHECK смотрят на
        # 8080) — крутится только имя. `WORLD_PORT` к этому адресу отношения не имеет: он
        # про вход с ХОСТА, а сосед по сети ходит мимо хост-публикации.
        aliases:
          - "${WORLD_DOOR_ALIAS:-door}"

networks:
  # Сеть общая на машину и старше любого компоуз-проекта: в ней стоят соседи, к которым
  # дверь ходит по имени. Потому `external` — компоуз её не создаёт и не сносит вместе
  # с проектом. Создаётся один раз (`deploy/up.sh` делает это сам, идемпотентно).
  omnifield-gateway:
    external: true

volumes:
  # Именованные, и имена заданы поимённо, а не собраны из имени проекта: состояние поля
  # обязано находиться и через полгода, кто бы и под каким именем проекта его ни поднимал.
  # Безымянного хранилища мир не признаёт (`kb:WORLD-28`).
  field:
    name: world-field
  # Журнал прогонов стенда — тоже состояние, и оно тоже переживает пересоздание. Без тома
  # оно умирало бы вместе с контейнером молча: снаружи это выглядит как «прогонов не было».
  stand:
    name: world-stand
