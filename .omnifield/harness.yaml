# harness.yaml — per-product СИД роль-модели (обвес агент-харнесса).
#
# Кладётся записью раскладки → .omnifield/harness.yaml, класс `placed-once`: станок кладёт файл
# один раз и дальше НЕ трогает — им владеет человек, заполняет под свой продукт. Рамка
# (инварианты ролей) впаяна в roles/*.md + shared-policy.md,
# а здесь — ДАННЫЕ роль-модели под конкретный продукт (kb:BRAIN2-12).
#
# ⚠️ Значения ниже — НЕЙТРАЛЬНЫЙ ШАБЛОН (my-product / backend / frontend). Замени на своё.
#
# ⚠️ ПИЛОТ. Раскладка полей этого файла ещё не устоялась: состав будет меняться, переезд
# плановый и объявленный (в частности, разделение должности и полномочий изменит секции
# `zones` и `git`). Файл твой — станок его не перезаписывает, — но при обновлении обвеса
# сверяйся с сидом новой версии: там появятся поля, которых здесь ещё нет.
apiVersion: omnifield.dev/v1
kind: harness

# Имя продукта — идёт в identity-баннер каждой сессии ("architect/main продукта <product>").
# Мир omnifield: пространство, законы и место наблюдателя, из которых потом собирается
# движок. Канон — `kb:WORLD` (владение перешло от architect baser), роадмап — `tasker:WORLD`,
# решение и маршрут, из которых раздел вырос, — `tasker:PILOT-11` и `tasker:PILOT-13`.
product: world

# Число архитекторов (main-сессий). Канон-дефолт — 3 (продукт/фронт/бэк); мелкий продукт — 1.
architects: 1

# Пины моделей по роли (провайдер claude-code; agent-as-provider — расширяемо провайдером).
# Дефолт-пресет: architect и owner — сильнейшая (opus-5), layer — haiku (узкий одноартефактный
# промпт). Эти же значения применяются, если секцию убрать. Переопредели под свой продукт.
#
# Берём АЛИАСЫ, а не снапшоты с датой (`claude-haiku-4-5`, не `claude-haiku-4-5-20251001`):
# алиас едет за выпусками сам, снапшот замораживает сессии на конкретной сборке и требует
# ручного обновления в каждом репозитории.
models:
  architect: claude-opus-5
  owner: claude-opus-5
  layer: claude-haiku-4-5

# Зоны продукта: scope (leaf-имя) → paths[] + краткое назначение. scope=main → architect.
# owner-<zone> владеет папками целиком (commit-only под git-gate). paths[] — МАССИВ: один
# owner может держать несколько папок; пути РАЗНЫХ зон не пересекаются (одна папка — один
# владелец, disjoint). ЗАМЕНИ на реальные папки. (legacy одиночный `path:` тоже читается.)
# Зоны заведены 2026-08-06 ОДНОВРЕМЕННО с появлением их папок — по правилу, записанному здесь
# же прошлым заходом (решение user 2026-08-05: пустая карта честнее путей на пустоту). Обе
# папки создаются тем же коммитом, что и эта запись; объявленных путей на пустоту нет.
# Раскладка плоская, а не `packages/*`: лестница `tasker:PILOT-11` просит уровней не плодить.
# Это КАРКАС ПОД СМОУК-ТЕСТ тулчейна, а не уровни мира. Почва · гравитация · атмосфера
# (`tasker:PILOT-13`) сюда ещё не разложены — когда разложатся, зоны переедут под них.
zones:
  core:
    paths: [core]
    description: Go-сторона — сервис мира и раздача веба
  web:
    paths: [web]
    # 2026-08-16: зона отвязана от probe-web (`WORLD2-127`). Панель — то, ЧЕРЕЗ ЧТО входят в
    # мир, и она не смеет зависеть от продуктов, живущих в мире: иначе круг — чтобы войти,
    # нужен инструмент; чтобы был инструмент, нужно войти (`WORLD2` 0.7 п. 6, 3.7). Обычные
    # библиотеки можно любые, наши — нельзя.
    description: тонкая панель управления и мониторинга — вход в мир (Solid + Vite, своих примитивов пять; ни одного продукта этого мира)
  # Зоны заведены 2026-08-11 ОДНОВРЕМЕННО с появлением папок — по правилу выше.
  # Режем на четыре по решению user: core и web делают вещи, deploy их складывает и
  # поднимает, cli — лицо для человека. Граница deploy особая: это НЕ стройка, а способ
  # существования скоупа (kb:WORLD-54), потому и отдельно от core.
  # Граница расширена 2026-08-21 (решение user): `.github` отдан этой зоне, а не заведён
  # восьмой. Довод: она уже владеет тем, чем репозиторий СОБИРАЕТСЯ и ВЫПУСКАЕТСЯ
  # (`build.sh`, `release.sh`); CI — то же семейство, только про то, чем он ПРОВЕРЯЕТСЯ.
  # Отдельная зона ради одного файла завела бы владельца без предмета.
  deploy:
    paths: [deploy, .github]
    description: как мир ставится и как проверяется — образ, файл запуска, раскладка, CI
  cli:
    paths: [cli]
    description: консоль мира @omnifield/cli — подъём, регистрация, сборка локаций
  # Зона заведена 2026-08-14 ОДНОВРЕМЕННО с появлением папки — по тому же правилу.
  # Решение user: инструменты, которых мир не изготавливает (`WORLD2` 0.1), делаем ЗДЕСЬ
  # отдельной папкой, чтобы потом вынести продуктом без раскопок, а не плодить продукт сейчас.
  # Первое такое средство — шлюз между ресурсами: юзеру расстояния между ними быть не должно
  # (`WORLD2` 3.5), а чем это сделано — не дело мира (`WORLD2` 9.1) и живёт в разделе `TECH`.
  gate:
    paths: [gate]
    description: шлюз между ресурсами — связь машин под капотом мира; VPN лишь один из вариантов
  # Зона заведена 2026-08-14 ОДНОВРЕМЕННО с появлением папки — по тому же правилу.
  # Решение user: управление вынесено из двери отдельной вещью (`WORLD2` 3.7). Дверь — вход
  # и выход, она не показывает и не распоряжается; контроллер — руки юзера: ставится руками,
  # разворачивает двери и места, несёт лицо для человека. Разделены они не ради стройности:
  # дверь смотрит наружу, и власть над машиной у неё означала бы входную дверь с ключами
  # от всего дома.
  control:
    paths: [control]
    description: контроллер — руки юзера: подъём дверей и мест, лицо пульта, работа с ресурсами
  # Зона заведена 2026-08-17 ОДНОВРЕМЕННО с появлением папки — по тому же правилу.
  # Решение user: скоуп юзера лежит ПО АДРЕСУ и раздаётся (`WORLD2` 3.4), а не хранится в
  # контроллере. Раздача не годится ни в одну из соседних зон, и это не вкусовщина: `core` —
  # сервис мира, `control` — руки юзера, а раздача НЕ СЛУЖБА МИРА ВОВСЕ. Это `0.3` (правило
  # розетки), применённое к личности: форма — мира, само изделие — юзера. Мы выпускаем ОДНУ
  # вилку как удобство, а не как единственно возможную; чужая, хоть на ардуино, равноправна.
  share:
    paths: [share]
    description: раздача скоупа — отдаёт и принимает файл состояния юзера по его адресу; две ручки, файл целиком

# Git-доступ по роли — РАМКА (инвариант shared-policy), приведён для наглядности,
# выключить нельзя: architect=full; owner=commit-only (gate); layer=none.
git:
  architect: full
  owner: commit-only
  layer: none

# Слот grabli (BRAIN2-7): tasker-ws, куда агенты пишут затыки/грабли ПОСЛЕ обсуждения с user
# (класс проблемы = родитель, конкретные случаи = дети). При накоплении — правим шаблоны/пресеты.
# Дефолт — центральный беклог под контролем architect; ЗАМЕНИ/убери под свой продукт.
grabli:
  workspace: GRABLI2

# Слот services (BRAIN2-9): базы omnifield-сервисов.
#
# ⚠️ ДЛЯ WINDSHIFT ЭТА ШАПКА БОЛЬШЕ НЕ ДЕЙСТВУЕТ. Сид говорит «доступ — CURL, НЕ
# MCP-инструменты (их может не быть — норма)». Для нашего стенда это оказалось неверно и
# стоило недели: MCP-сервер у Windshift ЕСТЬ, отдаёт 67 инструментов, и право `mcp:access`
# лежало в токене с самого начала. Работа сырым REST породила страницу «граблей», половина
# которых была не ограничением продукта, а следом неверного пути.
#
# Решение user 2026-08-15: **все агенты ходят через MCP, REST остаётся людям.** Это
# ОБЯЗАННОСТЬ, а не предпочтение — правило целиком в `TECH` 5. Ниже, в секции windshift,
# адрес MCP стоит первым; REST помечен как человеческий путь.
#
# Для tasker/knowledger шапка ниже действует как была.
#
# Адрес ЗАВИСИТ ОТ ОКРУЖЕНИЯ, подставь рабочий:
#   • сосед по docker-сети (product-devbox):  http://tasker:8030/tasker · http://knowledger:8040/knowledger
#   • если соседи недоступны — дверь через хост: http://host.docker.internal:8080/api/tasker · .../api/knowledger
#   • localhost:8080 — ТОЛЬКО с хост-машины, НЕ изнутри контейнера.
# Проверка связи: `curl -s <base>/healthz`. Сэндбокс Bash режет сеть → выполняй с сэндбоксом off.
#
# Адрес ПРОВЕРЕН 2026-08-06 из этого девбокса, а не взят из шаблона. Работает ровно один:
#   ✓ http://10.8.1.1:8080/api/…      — дверь контура, отвечает healthz 200
#   ✗ http://tasker:8030/tasker       — соседа по docker-сети НЕ видно (алиасов нет в этой сети)
#   ✗ http://host.docker.internal:8080 — дверь есть, апстрим не тот: nginx отвечает 502
# Токен bearer — это HANDLE сессии (`architect-main`), а не секрет: сервисы им подписывают
# автора, доступ открыт. Заголовок обязателен, без него — `{"error":"missing bearer token"}`.
services:
  # ⚠️ 2026-08-14, решение user: ЕДИНАЯ ВИТРИНА — Windshift. Знание (страницы) и работа
  # (задачи, роадмап, майлстоуны) живут ТАМ; tasker и knowledger оставлены только как
  # МАТЕРИАЛ, из которого дополняем. Раздел мира — `WORLD2` (ws id 3), техничка — `TECH`
  # (ws id 5), раздел агента Unity — `UNITY` (ws id 4).
  #
  # ⚠️ 2026-08-15, решение user: **АГЕНТ ХОДИТ ЧЕРЕЗ MCP. REST — ЛЮДЯМ.** Обязанность,
  # правило целиком — `TECH` 5. Сервер зарегистрирован в конфиге сессии (скоуп local, НЕ
  # `.mcp.json` в репозитории — репозиторий публичный), инструменты приходят сами.
  # Инструментов не видно — СКАЖИ USER И ОСТАНОВИСЬ, не уходи в REST молча.
  #
  # Токен в этот файл НЕ кладём: он живёт в конфиге MCP. Раньше его передавали сообщением
  # в каждую сессию, и он оседал в транскрипте — из-за чего owner-сессия однажды полезла за
  # ним в историю сессий. Копать секреты из логов запрещено.
  #
  # Что даёт MCP сверх REST: обращение по КЛЮЧУ (`get_item` c `item_key`), полнотекстовый
  # поиск (`search_items`, `search_knowledge`), `list_recent_activity` для подхвата сессии,
  # связи item↔page↔test_case, тест-прогоны, диаграммы. Грабли — `TECH` 4.
  # ⚠️ 2026-08-18: АДРЕС СМЕНИЛСЯ — было `10.8.1.1`, стало `10.8.1.3`. Причина не в стенде и
  # не в конфиге агента: user передеплоил VPN, и туннель ПЕРЕНАЗНАЧИЛ адреса нод. Стенд всё
  # это время работал, просто по другому адресу.
  #
  # ЭТО ПОВТОРИТСЯ. Адрес выдаётся туннелем, а не закреплён за машиной, и после каждого
  # передеплоя VPN он может стать другим. Поэтому: **стенд «лёг» — первым делом проверь
  # адрес, а не стенд.**
  #
  # Как найти живой адрес, не гадая (проверено 2026-08-18 из этого девбокса):
  #   curl -s -o /dev/null -m 5 -w '%{http_code}\n' http://10.8.1.<N>:8095/
  #   200 → он; 000 → не он. MCP там же: POST /mcp без токена обязан ответить 401.
  # Ходить `host.docker.internal` НЕ надо: на 8080 там чужой шлюз со старыми tasker/
  # knowledger, а на 8095 — пустой слушатель, который соединение принимает и молчит. На этом
  # 2026-08-18 потеряли час: порт «открыт», а за ним никого.
  windshift_mcp: http://10.8.1.3:8095/mcp          # ← агенты сюда
  windshift: http://10.8.1.3:8095/rest/api/v1      # людям и отладке; агенту — только с оговоркой вслух

# Слот pilots (BRAIN2-59): раздел пилотов — общая площадка продуктов, где механика обсуждается
# и обкатывается ДО того, как попадёт в каталог канонов (`kb:MECH`). Знание о мехе — в
# knowledger, работа и ступень (`пилот → обкатка → канон`) — в tasker; ссылка друг на друга
# обязательна. Правила раздела целиком — `kb:PILOT-1`. Убери секцию — правило молчит.
pilots:
  tasker: PILOT
  knowledger: PILOT

# Слот checkpoints (BRAIN2-58): корень чекпойнтов РОЛЕЙ — состояние прогона (где мы, что не
# доделано, что делать первым), чтобы рестарт/переезд контейнера не стоил сессии. Узел на роль,
# а не на сессию: адрес стабилен, описание = текущее состояние, комменты = история.
# Адрес несёт `root` (ключ узла-корня); `workspace` — где его искать.
#
# Раскладка заведена 2026-08-05: корень `tasker:WORLD-1`, свой узел роли — среди его детей
# (`tasker:WORLD-2` — architect/main). Адреса живые, не placeholder.
# Переехали 2026-08-14 в Windshift вместе со всей работой. Узел на роль — item в разделе
# `WORLD2`: architect/main — `WORLD2-84`, owner-gate — `WORLD2-82`. Прежние узлы в tasker
# помечены указателями и оставлены снимком.
checkpoints:
  workspace: WORLD2
  root: WORLD2-84
