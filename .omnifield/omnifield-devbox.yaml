# Настройки обвеса omnifield/devbox для локации world.
# Всё вне ключа `baser` принадлежит самому инструменту, дверь туда не смотрит.
baser:
  # Ходовое положение раскладки omnifield: общая сеть, общие тома, ассистент
  # внутри. Берём пресетом целиком — своих значений тут не придумываем.
  presets:
    - omnifield
  settings:
    # Скоуп приватного реестра. Без него постсоздание падает 401 ВНУТРИ установки,
    # и человек читает код ошибки вместо адреса, куда идти за токеном.
    npmScope: '@omnifield'
    # ИНВЕНТАРЬ ТУЛЧЕЙНА — до переезда, а не после (kb:BASER3-14, шаг 0).
    # Обвес девбокса node-центричный, и это его свойство, а не недосмотр: мир
    # строится на Go и вебе, значит Go обязан приехать настройкой, иначе локация
    # узнает о его отсутствии первым же прогоном сборки.
    # github-cli — дефолт обвеса; перечисляется здесь целиком, потому что карта
    # задаётся значением, а не дополняется.
    devcontainerFeatures:
      ghcr.io/devcontainers/features/github-cli:1: {}
      ghcr.io/devcontainers/features/go:1: {}
