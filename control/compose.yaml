# Файл запуска контроллера. Обычный докер, без девконтейнеров.
#
# Штатный вход — `./control/up.sh`: он делает то же самое одной командой и называет причину
# с выходом, когда что-то не встало. Напрямую тоже можно:
#
#   docker compose -f control/compose.yaml up -d --build
#
# ЧЕМ ЭТОТ ФАЙЛ ОТЛИЧАЕТСЯ ОТ ФАЙЛА ЗАПУСКА ДВЕРИ. Дверь торчит наружу машины и власти над
# ней не имеет. Контроллер — наоборот: наружу не торчит, а докер-сокет ему отдан. Это и
# есть та развилка, ради которой управление вынесли из двери (`WORLD2` 3.7): у входной
# двери не должно быть ключей от дома.
name: world-control

services:
  world-control:
    build:
      # Контекст — корень репозитория: в образ едет и `control/`, и `deploy/`.
      context: ..
      dockerfile: control/Dockerfile
    image: omnifield/world-control:dev
    container_name: world-control
    restart: unless-stopped

    # Публикация ПО УМОЛЧАНИЮ ТОЛЬКО В ПЕТЛЮ — и это не перестраховка. У контроллера есть
    # докер-сокет: кто дотянулся до него, тот распоряжается машиной. Открыть его наружу
    # хозяин может сознательно (`CONTROL_BIND=0.0.0.0`), но умолчанием такое не делают.
    ports:
      - "${CONTROL_BIND:-127.0.0.1}:${CONTROL_PORT:-8090}:8090"

    environment:
      CONTROL_ADDR: ":8090"
      CONTROL_REMOTE_SH: /opt/world/deploy/remote.sh
      CONTROL_KEYS: /root/.ssh
      # Хост-порт двери НА ДОБАВЛЯЕМОМ ресурсе. То же значение и то же имя, что у соседа.
      CONTROL_DOOR_PORT: "${WORLD_PORT:-8080}"

    volumes:
      # Власть над машиной. Её даёт ХОЗЯИН при подъёме, а не мир себе сам.
      - /var/run/docker.sock:/var/run/docker.sock
      # Связка ключей: ключи ресурсов и `config`, из которого их берёт ssh (а через ssh —
      # докер). Том, а не слой образа: переживает пересборку.
      - control-keys:/root/.ssh
      # Контексты докера — это и есть список ресурсов (своего реестра зона не заводит).
      # Без тома он терялся бы при каждом перезапуске, и заведённые ресурсы пропадали бы
      # молча — при живых дверях на них.
      - control-docker:/root/.docker
      # Скоупы, заведённые ЗДЕСЬ. Личность юзера — не времянка: она переживает и
      # перезапуск, и пересборку образа.
      - control-scope:/scope

    healthcheck:
      # Здоровье меряется тем, что контроллер ОТВЕЧАЕТ СВОИМ отказом: `not-signed-in` на
      # `/api/me` без входа — это полноценный ответ, а не поломка. Проверка «порт открыт»
      # зеленела бы на повисшем процессе; проверка «код 200» требовала бы завести ручку
      # ради проверки. Инструмент — bash, он в образе уже есть ради `remote.sh`.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090; printf 'GET /api/me HTTP/1.0\\r\\n\\r\\n' >&3; grep -q not-signed-in <&3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  control-keys:
  control-docker:
  control-scope:
