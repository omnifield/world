# Файл запуска контроллера. Обычный докер, без девконтейнеров.
#
# ЭТО ПУТЬ РАЗРАБОТЧИКА ЗОНЫ, А НЕ ПУТЬ ЮЗЕРА. Этот файл и `up.sh` лежат В РЕПОЗИТОРИИ, а на
# машине юзера репозитория нет и не будет: он ставит докер и тянет образ (`TECH` 2). Пульт у
# него поднимается ОДНОЙ командой `docker run` — она напечатана в `control/README.md`, а всё,
# что этот файл описывает вокруг подъёма, живёт для неё в точке входа образа
# (`control/control-entry.sh`, `WORLD2-120`).
#
# Штатный вход разработчика — `./control/up.sh`: он делает то же самое одной командой и
# называет причину с выходом, когда что-то не встало. Напрямую тоже можно:
#
#   docker pull ghcr.io/omnifield/world-control:latest        # ← сначала явно притянуть
#   docker compose -f control/compose.yaml up -d --no-build
#
# `--no-build` здесь не украшение. Раздел `build:` ниже остался (им пользуется ВЫПУСК —
# `deploy/build.sh --control`), а значит компоуз, не найдя образа, молча собрал бы его сам.
# Юзеру собирать нечем: сборка пульта требует поля (`WORLD2-110`). Поэтому образ тянут
# ЯВНО и отдельным шагом, а компоузу запрещают собирать ключом.
#
# ЧЕМ ЭТОТ ФАЙЛ ОТЛИЧАЕТСЯ ОТ ФАЙЛА ЗАПУСКА ДВЕРИ. Наружу торчат оба, а вот власть над
# машиной есть только у контроллера: у двери докер-сокета нет и не будет никогда
# (`WORLD2` 3.7 — у входной двери не бывает ключей от всего дома). Разошлись они не в том,
# кто виден снаружи, а в том, кто чем распоряжается.
name: world-control

services:
  world-control:
    build:
      # Контекст — корень репозитория: в образ едет и `control/`, и `deploy/`.
      context: ..
      dockerfile: control/Dockerfile
    # ИМЯ ОБРАЗА — ПОЛНОЕ, С РЕЕСТРОМ, и это то самое место, где оно живёт в одном
    # экземпляре: отсюда его берёт подъём (что тянуть), отсюда же — выпуск соседа
    # (`deploy/release.sh`, куда отдавать). Своей копии ни у сборки, ни у выпуска нет
    # намеренно — вторая копия разъехалась бы с первой молча, и юзер тянул бы не то,
    # что мы публикуем.
    #
    # Почему адрес полный, а не `omnifield/world-control`. Короткое имя докер достраивает
    # своим умолчанием (Docker Hub), а мы публикуем в ghcr — юзер тянул бы из чужого
    # реестра и получал бы «образа нет» вместо образа. Контроллер обязан ЗНАТЬ, откуда
    # тянуть, а не догадываться; выпуск это имя разбирает честно и публикует ровно туда.
    #
    # `CONTROL_IMAGE` — чтобы поднять НАЗВАННЫЙ выпуск, а не подвижный `latest`: выпуск
    # кладёт в реестр ещё и неподвижный `sha-<7 знаков коммита>`.
    #   CONTROL_IMAGE=ghcr.io/omnifield/world-control:sha-a030d21 ./control/up.sh
    image: ${CONTROL_IMAGE:-ghcr.io/omnifield/world-control:latest}
    container_name: world-control
    restart: unless-stopped

    # ┌───────────────────────────────────────────────────────────────────────────────┐
    # │ ПУБЛИКАЦИЯ НАРУЖУ — УМОЛЧАНИЕ (решение user 2026-08-18, `WORLD2-150` B4).      │
    # │                                                                                │
    # │ В пульт может зайти любой, кто знает его адрес. Пока он публиковался только в    │
    # │ петлю, дойти до него с другой машины можно было лишь в обход — туннелем, — а     │
    # │ обхода в потоке нет: закрытый в петлю пульт не пульт, а локальная страница.      │
    # │                                                                                │
    # │ ЦЕНА ОСТАЛАСЬ И НАЗЫВАЕТСЯ ВСЛУХ, а не смягчается умолчанием: контроллер держит │
    # │ ДОКЕР-СОКЕТ этой машины (см. `volumes` ниже). Кто дошёл до пульта — дошёл до     │
    # │ машины. Правило «ставь контроллер там, где не жалко» от этого решения не         │
    # │ слабеет, а становится обязательным к произнесению — точка входа образа говорит   │
    # │ его человеку каждым подъёмом.                                                   │
    # │                                                                                │
    # │ Закрыть обратно в петлю хозяин может сознательно: `CONTROL_BIND=127.0.0.1`.      │
    # └───────────────────────────────────────────────────────────────────────────────┘
    ports:
      - "${CONTROL_BIND:-0.0.0.0}:${CONTROL_PORT:-8090}:8090"

    environment:
      CONTROL_ADDR: ":8090"
      CONTROL_REMOTE_SH: /opt/world/deploy/remote.sh
      # Каталог рецептов: ЧТО контроллер умеет поднимать на ресурсах. В образе он пуст —
      # перечня вещей у мира нет (`WORLD2` 3.7). Свои вещи хозяин машины кладёт сюда
      # монтированием, и для этого не нужны ни правка кода, ни пересборка образа.
      CONTROL_RECIPES: /opt/world/recipes
      # Рецепт РАЗДАЧИ СКОУПА: им контроллер поднимает личность юзера на названной им
      # машине (`WORLD2` 3.4). Раздача — обычная вещь мира и поднимается тем же путём, что
      # все прочие; рецепт едет в образе рядом с подъёмом и с рецептом двери.
      CONTROL_SHARE_RECIPE: /opt/world/share/compose.yaml
      # Связка ключей — ВРЕМЯНКА: ключи территорий раскладываются из скоупа при входе и
      # снимаются при выходе. Своего состояния контроллер не держит (`WORLD2` 1.9).
      CONTROL_KEYS: /root/.ssh
      # Лицо для человека живёт ПРИ КОНТРОЛЛЕРЕ (`WORLD2` 3.7): пульт приезжает собранным
      # в образе и раздаётся тем же адресом, что и ручки. Тома под него нет намеренно —
      # пульт это часть ВЫПУСКА, а не состояние: том пережил бы пересборку и молча
      # показывал бы прошлое лицо поверх нового контроллера.
      CONTROL_PULT: /opt/world/pult
      # Хост-порт двери НА ДОБАВЛЯЕМОМ ресурсе. То же значение и то же имя, что у соседа.
      CONTROL_DOOR_PORT: "${WORLD_PORT:-8080}"

    volumes:
      # Власть над машиной. Её даёт ХОЗЯИН при подъёме, а не мир себе сам.
      - /var/run/docker.sock:/var/run/docker.sock
      # ┌───────────────────────────────────────────────────────────────────────────────┐
      # │ ОБА ТОМА НИЖЕ — ВРЕМЯНКИ, А НЕ СОСТОЯНИЕ (`WORLD2` 1.9, `WORLD2-124`).         │
      # │                                                                                │
      # │ Ключи территорий и контексты докера ПРОИЗВОДНЫ от скоупа: поднимаются из него   │
      # │ при входе, снимаются при выходе. Тома здесь стоят ради удобства ssh и докера    │
      # │ (им нужны настоящие каталоги с правами), а не ради сохранности: потеряй их —    │
      # │ вход по адресу и паролю разложит всё заново.                                    │
      # │                                                                                │
      # │ ТОМА ПОД СКОУП ЗДЕСЬ НЕТ И НЕ БУДЕТ. Личность юзера лежит там, где он её положил,│
      # │ и раздаётся раздачей (`3.4`). Пока она лежала томом контроллера, снос            │
      # │ контроллера означал потерю себя — это и убирает ступень 2.                      │
      # └───────────────────────────────────────────────────────────────────────────────┘
      - control-keys:/root/.ssh
      - control-docker:/root/.docker

    # HEALTHCHECK-а здесь НЕТ намеренно — он объявлен В ОБРАЗЕ (`control/Dockerfile`), и
    # компоуз наследует объявленное. Причина переезда: юзер поднимает контроллер одной
    # командой `docker run`, и здоровье, объявленное только здесь, до него не доехало бы
    # вовсе (`WORLD2-120`). Второе объявление здесь означало бы две правды о том, чем
    # меряется здоровье, — и разъехались бы они молча.

volumes:
  # ИМЕНА ЗАДАНЫ ПОИМЁННО, а не собраны из имени проекта (`world-control_control-keys`), и
  # это не косметика: ровно эти имена стоят в команде `docker run` из `control/README.md`.
  # Разъедься они — путь юзера и путь разработчика молча завели бы ДВА РАЗНЫХ состояния на
  # одной машине, и человек, перешедший с одного на другой, увидел бы пустую связку при
  # живых ключах рядом. Приём взят у соседа (`deploy/compose.yaml`: `world-field`,
  # `world-stand`), а не выдуман заново.
  control-keys:
    name: world-control-keys
  control-docker:
    name: world-control-docker
