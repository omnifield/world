# Файл запуска раздачи — он же РЕЦЕПТ, которым её поднимают на машине юзера.
#
# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │ ЭТОТ ФАЙЛ ЧИТАЮТ ДВОЕ, И ОБА ЗАКОННЫ:                                                │
# │                                                                                      │
# │   разработчик зоны   `./share/up.sh` — поднять раздачу здесь и потрогать руками;      │
# │   подъём вещи        `deploy/remote.sh add <имя> --recipe <этот файл>` — поднять её   │
# │                      НА НАЗВАННОЙ МАШИНЕ, куда человек не заходит вовсе.              │
# │                                                                                      │
# │ Второй путь — то, ради чего рецепты и заведены (`WORLD2-131`): что поднимается,       │
# │ говорит РЕЦЕПТ, а не код контроллера. Появление раздачи не потребовало ни строки в    │
# │ соседних зонах — только этот файл и образ, на который он показывает.                  │
# └─────────────────────────────────────────────────────────────────────────────────────┘
#
# ЧЕМ РАЗДАЧА ОТЛИЧАЕТСЯ ОТ ДВЕРИ И КОНТРОЛЛЕРА — тем, куда она смотрит:
#
#   дверь         торчит наружу машины, власти над ней не имеет            (`deploy/compose.yaml`)
#   контроллер    наружу НЕ торчит, но держит докер-сокет — власть          (`control/compose.yaml`)
#   раздача       торчит наружу и власти не имеет ВОВСЕ: ни сокета, ни сети мира
#
# Наружу она торчит по необходимости, а не по вкусу: до неё дотягивается контроллер юзера
# с другой машины — в этом вся её работа. Сокета докера у неё нет и не будет: раздача
# ничего не поднимает и ничем не управляет, она отдаёт файл.
#
# В СЕТЬ МИРА (`omnifield-gateway`) РАЗДАЧА НЕ ВСТАЁТ. Она не служба мира (`WORLD2` 3.4):
# личность юзера существует раньше, чем поднята хоть одна дверь, и членство в сети мира
# завело бы зависимость личности от мира — то есть круг.
name: ${SHARE_NAME:-world-share}

services:
  share:
    # ИМЯ ОБРАЗА — ПОЛНОЕ, С РЕЕСТРОМ, и живёт оно здесь в одном экземпляре: отсюда его
    # берёт подъём (что тянуть на ту машину) и отсюда же — выпуск. Короткое имя докер
    # достроил бы своим умолчанием (Docker Hub), а публикуем мы в ghcr: юзер тянул бы из
    # чужого реестра и получал «образа нет» вместо образа.
    #
    # `SHARE_IMAGE` — чтобы поднять НАЗВАННЫЙ выпуск вместо подвижного `latest`.
    image: ${SHARE_IMAGE:-ghcr.io/omnifield/world-share:latest}
    # Раздел `build:` остаётся для РАЗРАБОТЧИКА ЗОНЫ (`./share/up.sh --build`). Юзеру он
    # не грозит: подъём на его машине тянет готовый образ. Контекст — сама зона: раздача
    # не берёт в образ ничего чужого.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SHARE_NAME:-world-share}
    restart: unless-stopped

    # ПУБЛИКАЦИЯ НАРУЖУ — УМОЛЧАНИЕ, и это осознанно, а не по невнимательности. До раздачи
    # обязан дотянуться контроллер юзера, стоящий на другой машине; закрытая в петлю
    # раздача не раздаёт ничего и никому.
    #
    # Цена названа вслух: пароль едет по HTTP открытым текстом. Базовый слой секьюрности в
    # мире один — пароль (`WORLD2` 3.4); всё, что сверх, строит сам юзер и это его вилка:
    # туннель (`gate/`), свой обратный сторож с TLS, своя сеть. Мир не запрещает и не
    # требует.
    ports:
      - "${SHARE_BIND:-0.0.0.0}:${SHARE_PORT:-8070}:8070"

    environment:
      SHARE_ADDR: ":8070"
      SHARE_STATE: /state/scope.json
      # ПАРОЛЬ НАЗЫВАЕТ ТОТ, КТО ПОДНИМАЕТ, и `:?` здесь обязателен. Без него компоуз
      # подставил бы пустую строку, раздача отказалась бы подниматься уже НА ЧУЖОЙ машине,
      # и человек получил бы «контейнер упал» вместо причины. Так он получает причину
      # ЗДЕСЬ — до того, как что-либо уехало.
      SHARE_PASSWORD: ${SHARE_PASSWORD:?пароль скоупа не назван: подними с SHARE_PASSWORD=<пароль> — им закрыта раздача, и внутри файла состояния его нет}
      # Предел одной записи. Значение по умолчанию — в коде (`internal/state`); здесь оно
      # второй копией не заводится, иначе две правды о пределе разъедутся молча.
      SHARE_LIMIT: ${SHARE_LIMIT:-}

    volumes:
      # Личность юзера. Том, а не слой образа: вещь живёт, пока жив её том (`WORLD2` 1.9),
      # и снятие раздачи не должно означать потерю себя. `remote.sh drop` состояние
      # оставляет; стирает его только явное `--with-state`.
      - state:/state

    # HEALTHCHECK-а здесь НЕТ намеренно — он объявлен В ОБРАЗЕ (`share/Dockerfile`), и
    # компоуз наследует объявленное. Второе объявление означало бы две правды о том, чем
    # меряется здоровье, и разъехались бы они молча.

volumes:
  state:
    # Имя задано ПОИМЁННО, а не собрано из имени проекта: ровно это имя стоит в командах
    # `share/up.sh` и в разборе «где лежит моя личность» (`share/PROTOCOL.md`). Разъедься
    # они — человек искал бы личность в томе, которого нет, при живой раздаче рядом.
    name: ${SHARE_NAME:-world-share}-state
